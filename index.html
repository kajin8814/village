<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>깜찍이 마을</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#fbfff6; --panel-2:#eaf8e2; --ink:#2f4a3a; --ink-soft:#62806b; --line:#c9e6bd;
  --accent:#5fc4a0; --accent-ink:#ffffff; --bell:#f2c44a; --bell-ink:#5a4310; --danger:#e57f74;
  --hard:0 3px 0 rgba(47,74,58,.22); --scrim:rgba(38,66,48,.38); --bg:#b6e39a;
  --font-title:"Jua","Gowun Dodum",system-ui,sans-serif; --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#22322a; --panel-2:#2b4135; --ink:#e6f6ea; --ink-soft:#a6c6b0; --line:#3e5c4a;
    --accent:#58b893; --accent-ink:#0f2219; --bell:#e8bb3f; --bell-ink:#2d2006; --danger:#e07a70;
    --hard:0 3px 0 rgba(0,0,0,.4); --scrim:rgba(4,14,9,.55); --bg:#1d2b23; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#22322a; --panel-2:#2b4135; --ink:#e6f6ea; --ink-soft:#a6c6b0; --line:#3e5c4a;
  --accent:#58b893; --accent-ink:#0f2219; --bell:#e8bb3f; --bell-ink:#2d2006; --danger:#e07a70;
  --hard:0 3px 0 rgba(0,0,0,.4); --scrim:rgba(4,14,9,.55); --bg:#1d2b23; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;background:#b6e39a}
button{font-family:var(--font-title);font-size:15px;color:var(--ink);background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:6px 12px;box-shadow:var(--hard);cursor:pointer;line-height:1.2}
button:active{transform:translateY(2px);box-shadow:none}
button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--hard)}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.bell{background:var(--bell);color:var(--bell-ink)}
button.ghost{box-shadow:none;border-color:var(--line);background:transparent}
:focus-visible{outline:3px solid #ffb84d;outline-offset:2px}
input,textarea,select{font-family:var(--font-body);font-size:16px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
label{font-family:var(--font-title);font-size:14px;display:block;margin:10px 0 4px}

#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;pointer-events:none;z-index:10}
#hud > *{pointer-events:auto}
.hud-card{background:var(--panel);border:2px solid var(--ink);border-radius:12px;box-shadow:var(--hard);padding:6px 12px}
.hud-title{font-family:var(--font-title);font-size:20px;line-height:1.1}
#clock{font-size:13px;color:var(--ink-soft)}
.hud-stats{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--font-title);font-size:14px;background:var(--panel);border:2px solid var(--ink);border-radius:999px;padding:4px 10px;box-shadow:var(--hard);white-space:nowrap}
.chip.bell{background:var(--bell);color:var(--bell-ink)}
.chip.solo{background:#ffe1d6;color:#7a3a22}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#46c07a;margin-right:5px;vertical-align:1px}
.hud-right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hud-right button{padding:5px 10px;font-size:14px}
@media (max-width:640px){
  .hud-right{width:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
  .hud-right button{flex:0 0 auto}
  .hud-title{font-size:17px}
}

#bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:min(560px,calc(100% - 20px));z-index:10;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#bottom > *{pointer-events:auto}
#chatlog{display:flex;flex-direction:column;gap:3px;max-height:150px;overflow:hidden;pointer-events:none;justify-content:flex-end}
.chatline{align-self:flex-start;background:rgba(255,255,255,.88);color:#2f4a3a;border-radius:10px;padding:3px 10px;font-size:14px;max-width:100%;transition:opacity .6s;overflow-wrap:anywhere}
.chatline b{font-family:var(--font-title);font-weight:400;margin-right:6px;color:#2e8a68}
.chatline.notice{background:#fff3c4}
.chatline.notice b{color:#9a6b00}
.chatline.fade{opacity:0}
#hint{align-self:center;font-family:var(--font-title);font-size:15px;background:var(--ink);color:var(--panel);border-radius:999px;padding:5px 14px}
.chatbar{display:flex;gap:6px}
.chatbar input{flex:1;min-width:0;border:2px solid var(--ink);box-shadow:var(--hard)}
#emotes{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:6px;box-shadow:var(--hard)}
#emotes[hidden]{display:none}
#emotes button{font-size:20px;padding:4px 0;font-family:var(--font-body);box-shadow:none;border-color:var(--line)}
#emotes small{display:block;font-size:10px;font-family:var(--font-title);color:var(--ink-soft)}

#pad,#abtn{display:none}
body.touch #pad{display:grid;position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;z-index:11}
body.touch #pad button{font-size:20px;padding:0;border-radius:12px;opacity:.92;touch-action:none}
body.touch #abtn{display:block;position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);width:78px;height:78px;border-radius:50%;background:#ffd84d;color:#5a4310;font-size:30px;z-index:11;touch-action:none}

#toasts{position:fixed;top:calc(var(--hud-h, 76px) + 8px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:40;pointer-events:none;width:min(440px,calc(100% - 24px))}

.toast{background:var(--panel);border:2px solid var(--ink);border-radius:12px;box-shadow:var(--hard);padding:8px 14px;font-size:15px;text-align:center;animation:pop .25s ease-out}
.toast.good{background:#dff7e9;color:#2f4a3a}
.toast.warn{background:#ffe9df;color:#2f4a3a}
.banner{background:#fff3c4;color:#5a4310;border:2px solid #5a4310;border-radius:14px;padding:10px 16px;box-shadow:0 3px 0 rgba(90,67,16,.3);text-align:center;font-size:16px;animation:pop .3s ease-out;overflow-wrap:anywhere}
.banner strong{display:block;font-family:var(--font-title);font-weight:400;font-size:14px;margin-bottom:2px}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.toast,.banner,.modal{animation:none!important}}

.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:30;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.modal{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 rgba(47,74,58,.3);width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;animation:pop .2s ease-out}
.modal-head{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;border-bottom:2px dashed var(--line)}
.modal-head h2{font-family:var(--font-title);font-weight:400;font-size:22px;margin:0;flex:1}
.tabs{display:flex;gap:6px;padding:10px 14px 0;overflow-x:auto;flex:0 0 auto}
.tabs button{box-shadow:none;border-color:var(--line);background:var(--panel-2);flex:0 0 auto}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--ink)}
.modal-body{padding:12px 14px 16px;overflow-y:auto}
.lead{margin:0 0 10px;color:var(--ink-soft);font-size:15px;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.card{background:var(--panel-2);border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .row{display:flex;align-items:center;gap:8px}
.card .icon{font-size:28px;line-height:1;width:36px;text-align:center;flex:0 0 auto}
.card canvas{image-rendering:pixelated;flex:0 0 auto;background:#e7f7dc;border-radius:10px}
.card h3{font-family:var(--font-title);font-weight:400;font-size:17px;margin:0;overflow-wrap:anywhere}
.card p{margin:0;font-size:14px;color:var(--ink-soft);overflow-wrap:anywhere;line-height:1.45}
.card .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.card.wide{grid-column:1/-1}
.card.empty{border-style:dashed;opacity:.8}
.badge{font-family:var(--font-title);font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 8px;display:inline-block;margin-top:2px}
.badge.gold{background:var(--bell);color:var(--bell-ink)}
.stack{display:flex;flex-direction:column;gap:8px}
.inline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-soft);font-size:14px}
.big-num{font-family:var(--font-title);font-size:40px}

.editor{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.editor canvas.grid{border:2px solid var(--ink);border-radius:8px;touch-action:none;image-rendering:pixelated;background:#fff;cursor:crosshair;max-width:100%}
.palette{display:grid;grid-template-columns:repeat(8,28px);gap:4px}
.palette button{width:28px;height:28px;padding:0;border-radius:7px;box-shadow:none;border:2px solid rgba(0,0,0,.25)}
.palette button[aria-pressed="true"]{border:3px solid var(--ink);transform:scale(1.08)}
.toolrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.toolrow button{font-size:13px;padding:4px 9px;box-shadow:none}
.toolrow button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.previews{display:flex;gap:6px;margin-top:6px}
.previews canvas{background:#d9f2c8;border-radius:8px;image-rendering:pixelated}

.roomview{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:linear-gradient(#fff4e3 0 58%,#e9c99d 58%);border:2px solid var(--ink);border-radius:14px;padding:12px;min-height:130px;color:#2f4a3a}
.roomview span{font-size:34px;text-align:center;align-self:end;position:relative}
.roomview{position:relative}
.roomview .wallbg{position:absolute;left:0;right:0;top:0;height:58%;border-radius:12px 12px 0 0}
.roomview .none{grid-column:1/-1;align-self:center;text-align:center;font-size:15px;color:#7d6a4f;position:relative}

.gamebox{display:flex;flex-direction:column;align-items:center;gap:10px}
.gamebox canvas{border:2px solid var(--ink);border-radius:12px;background:#dff4ff;touch-action:none;max-width:100%}
.tapbtn{font-size:26px;padding:18px 34px;border-radius:18px}

#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(182,227,154,.86);z-index:25;text-align:center;padding:20px;color:#2f4a3a}
#loading[hidden]{display:none}
#loading h1{font-family:var(--font-title);font-weight:400;font-size:44px;margin:0;color:#2e7d5b;text-shadow:0 3px 0 #fff}
#loading p{margin:0;font-size:16px}

.bag-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:10px}
.slot{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;min-width:0}
.slot small{position:absolute;right:3px;bottom:0;font-size:11px;font-family:var(--font-title);color:var(--ink)}
.slot.empty{opacity:.45}
.slot canvas{max-width:100%}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.subtabs button{font-size:13px;padding:4px 10px;box-shadow:none;border-color:var(--line)}
.subtabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--ink)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.dex .cell{border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;background:var(--panel-2);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.35}
.dex .cell .ic{font-size:26px;height:40px;display:flex;align-items:center}
.dex .cell b{font-family:var(--font-title);font-weight:400;font-size:14px}
.dex .cell.unknown{opacity:.6;border-style:dashed}
.treadmill{width:220px;height:110px;border:2px solid var(--ink);border-radius:14px;background:#dcebf2;position:relative;overflow:hidden}
.treadmill .belt{position:absolute;left:10px;right:10px;bottom:12px;height:14px;background:repeating-linear-gradient(90deg,#4a5a63 0 10px,#61727c 10px 20px);border-radius:7px}
.treadmill.on .belt{animation:belt .45s linear infinite}
.treadmill canvas{position:absolute;left:50%;bottom:22px;transform:translateX(-50%)}
@keyframes belt{to{background-position:-20px 0}}
@media (prefers-reduced-motion: reduce){.treadmill.on .belt{animation:none}}
#bbtn{display:none}
body.touch #bbtn{display:block;position:fixed;right:110px;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);width:62px;height:62px;border-radius:50%;font-size:14px;padding:0;z-index:11;touch-action:none}

input[type=range]{padding:0;border:0;background:transparent}
.housebar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.housebar[hidden]{display:none}
#decopanel{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 70px);width:min(300px,calc(100% - 20px));max-height:calc(100% - 250px);overflow:auto;background:var(--panel);border:2px solid var(--ink);border-radius:14px;box-shadow:var(--hard);padding:10px;z-index:12}
#decopanel[hidden]{display:none}
@media (max-width:640px){#decopanel{top:auto;left:10px;right:10px;width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);max-height:34vh}}
.deco-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:var(--font-title);font-size:17px}
.deco-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.deco-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:12px;box-shadow:none;border-color:var(--line)}
.deco-item .ic{font-size:24px}
.deco-item[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--ink)}
#duelhud{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 132px);left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:#2f4a3a;color:#fff;border:2px solid #fff;border-radius:999px;padding:6px 16px;font-family:var(--font-title);z-index:15;white-space:nowrap}
#duelhud[hidden]{display:none}
#duelhud b{font-weight:400;font-size:22px;color:#ffd84d}
@media (max-width:640px){#duelhud{bottom:calc(env(safe-area-inset-bottom,0px) + 250px);font-size:13px}}
.slider-row{display:flex;align-items:center;gap:8px;margin:6px 0}
.slider-row input{flex:1}
.pv-wrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.colorrow{display:flex;gap:6px;flex-wrap:wrap}
.colorrow button{width:34px;height:34px;padding:0;border-radius:9px;box-shadow:none}
.colorrow button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.opt-row{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.opt-row button{font-size:13px;padding:5px 10px;box-shadow:none;border-color:var(--line)}
.opt-row button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--ink)}
.sec-title{font-family:var(--font-title);font-size:15px;margin:10px 0 4px}
.badge.done{background:#2e8a68;color:#fff}

[hidden]{display:none!important}
.cm-wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr);gap:12px}
@media (max-width:720px){.cm-wrap{grid-template-columns:1fr}}
.cm-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.cm-word{font-family:var(--font-title);font-size:20px;letter-spacing:.04em}
.cm-time{font-family:var(--font-title);font-size:22px;font-weight:400;color:#e0605a}
.cm-status{color:var(--ink-soft);font-size:14px;margin:0 0 6px}
.cm-score{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.cm-score div{display:flex;justify-content:space-between;gap:6px;background:var(--panel-2);border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-size:14px}
.cm-score b{font-family:var(--font-title);font-weight:400}
.cm-log{height:210px;overflow-y:auto;background:var(--panel-2);border:2px solid var(--line);border-radius:10px;padding:6px 8px;font-size:14px;display:flex;flex-direction:column;gap:2px;margin-bottom:6px;overflow-wrap:anywhere}
.cm-line.sys{color:var(--ink-soft)}
.cm-line.ok{color:#2e8a68;font-family:var(--font-title)}
.cm-line.mine{color:#3d6bd9}
.cm-colors{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cm-colors button.dot{width:26px;height:26px;padding:0;border-radius:50%;box-shadow:none;border:2px solid rgba(0,0,0,.2)}
.cm-colors button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.cm-colors button.tool{font-size:13px;padding:4px 9px;box-shadow:none}
.nunchi-btn{width:min(240px,64vw);aspect-ratio:1;border-radius:50%;font-size:64px;background:var(--bell);color:var(--bell-ink);border-width:4px;box-shadow:0 6px 0 rgba(47,74,58,.3);margin:6px auto 12px;display:block}
.nunchi-btn:disabled{opacity:.55;box-shadow:0 6px 0 rgba(47,74,58,.3)}
#gamehud{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--hud-h, 74px) + 6px);width:min(540px,calc(100% - 20px));background:var(--panel);border:3px solid var(--ink);border-radius:16px;box-shadow:var(--hard);padding:10px 14px;z-index:14;text-align:center}

#gamehud .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap}
#gamehud .meta b{font-family:var(--font-title);font-weight:400;font-size:17px;color:var(--ink)}
#gamehud .q{font-family:var(--font-title);font-size:19px;margin:6px 0;line-height:1.35}
body.has-gamehud #toasts{top:calc(var(--hud-h, 76px) + 150px)}
.wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px}
.ladder-scroll{overflow-x:auto;max-width:100%;margin-top:10px}
.ladder-scroll canvas{background:#fffdf5;border:2px solid var(--line);border-radius:12px;display:block}

.qz-quote{font-family:var(--font-title);font-size:26px;text-align:center;padding:18px 12px;background:var(--panel-2);border:2px dashed var(--line);border-radius:14px;margin:6px 0 8px;min-height:72px;line-height:1.4;overflow-wrap:anywhere}
.qz-hint{font-family:var(--font-title);font-size:16px;color:#c0841a;text-align:center;min-height:22px}

.solo-canvas{width:100%;max-width:640px;height:auto;border:2px solid var(--ink);border-radius:12px;background:#dff4ff;touch-action:manipulation;display:block;margin:0 auto}
.reels{display:flex;gap:10px;justify-content:center;margin:10px 0}
.reel{width:92px;height:92px;border:3px solid var(--ink);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:52px;box-shadow:var(--hard)}
.reel.win{background:#fff3c4;border-color:#c0841a}
.paytable{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:13px;color:var(--ink-soft)}
.paytable span{background:var(--panel-2);border:2px solid var(--line);border-radius:999px;padding:2px 9px}
.dice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin:8px 0}
.dice-grid button{box-shadow:none;border-color:var(--line);font-size:15px;padding:6px 4px}
.dice-grid button small{display:block;font-size:11px;color:var(--ink-soft)}
.dice-grid button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--ink)}
.dice-grid button[aria-pressed="true"] small{color:var(--accent-ink)}
.dice-faces{display:flex;gap:18px;justify-content:center;font-size:84px;line-height:1;color:var(--ink);margin:8px 0}
.cardrow{display:flex;gap:6px;flex-wrap:wrap;min-height:84px;margin:4px 0 10px}
.pcard{width:56px;height:80px;border:2px solid #2f4a3a;border-radius:8px;background:#fff;color:#2f4a3a;display:flex;flex-direction:column;justify-content:space-between;padding:4px 6px;font-family:var(--font-title);font-size:18px}
.pcard.red{color:#d8343a}
.pcard.back{background:repeating-linear-gradient(45deg,#7cc9a7 0 6px,#5fb393 6px 12px)}
.pcard span:last-child{align-self:flex-end;font-size:22px}

.g2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#cdb896;padding:8px;border-radius:14px;width:min(340px,100%);margin:8px auto;touch-action:none;outline:none}
.g2048 div{aspect-ratio:1;border-radius:10px;background:#e8dcc4;display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-size:26px;color:#5a4a3a}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(360px,100%);margin:8px auto}
.mem-card{aspect-ratio:1;font-size:34px;padding:0;background:repeating-linear-gradient(45deg,#7cc9a7 0 8px,#5fb393 8px 16px);color:#2f4a3a}
.mem-card.up{background:#ffffff}
.mem-card.ok{background:#fff3c4;box-shadow:none}
.mole-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(360px,100%);margin:8px auto}
.mole-hole{aspect-ratio:1;border-radius:50%;font-size:46px;padding:0;background:radial-gradient(circle at 50% 70%,#8a6a42 0 38%,#b6e39a 40%);box-shadow:none;border-color:#6b8f5a}
.mole-hole.hit{background:radial-gradient(circle at 50% 70%,#ffd84d 0 38%,#b6e39a 40%)}
.mole-hole.bad{background:radial-gradient(circle at 50% 70%,#e8736f 0 38%,#b6e39a 40%)}
.game-stats{display:flex;justify-content:center;gap:16px;font-family:var(--font-title);font-size:18px;flex-wrap:wrap}

.design-grid{border:2px solid var(--ink);border-radius:8px;touch-action:none;cursor:crosshair;max-width:100%;background:#fff}
.slot-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

#bosshud{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--hud-h, 74px) + 6px);width:min(540px,calc(100% - 20px));background:#3a1f24;color:#fff;border:3px solid #ffd84d;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.3);padding:8px 14px;z-index:14}
#bosshud .bh-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--font-title);font-size:16px}
#bosshud .bh-bar{height:12px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;margin:6px 0 4px}
#bosshud .bh-bar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b6b,#ffb84d);transition:width .2s}
#bosshud .bh-sub{display:flex;justify-content:space-between;gap:8px;font-size:13px;opacity:.9;flex-wrap:wrap}
body.has-bosshud #toasts{top:calc(var(--hud-h, 76px) + 96px)}
.train-box{display:flex;flex-direction:column;align-items:center;gap:10px}
.train-box canvas{border:2px solid var(--ink);border-radius:12px;background:#f3fbef;max-width:100%}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin:6px 0 10px}
.stat-grid div{background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:14px}
.stat-grid b{font-family:var(--font-title);font-weight:400;font-size:20px;display:block}

#joy,#padToggle{display:none}
body.touch:not(.pad-mode) #pad{display:none}
body.touch:not(.pad-mode) #joy{display:block;position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.45);border:3px solid rgba(47,74,58,.45);z-index:11;touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:#5fc4a0;border:3px solid #2f4a3a;box-shadow:0 3px 0 rgba(0,0,0,.25);pointer-events:none}
body.touch #padToggle{display:block;position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 244px);font-size:12px;padding:4px 10px;z-index:11;opacity:.92}

img.pxe{height:1.2em;width:auto;vertical-align:-0.22em;image-rendering:pixelated;display:inline-block;margin:0 .04em;pointer-events:none}

<body>
<canvas id="game" aria-label="깜찍이 마을 지도"></canvas>

    <span class="chip solo" id="solo" hidden>혼자 모드</span>
    <span class="chip" id="chest">보물상자 4개 남음</span>
  </div>

    <button data-open="board">게시판</button>
    <button data-open="roster">주민 명부</button>
    <button data-open="arcade">오락실</button>
    <button data-open="help">도움말</button>

</div>

<div id="duelhud" hidden aria-live="polite"></div>
<div id="gamehud" hidden aria-live="polite"></div>
<div id="bosshud" hidden aria-live="polite"></div>
<div id="decopanel" hidden></div>

<div id="bottom">

  <div id="hint" hidden></div>
  <div id="emotes" hidden></div>
  <div id="housebar" class="housebar" hidden></div>

  </div>
</div>

<div id="pad" aria-hidden="true">

  <button data-dir="left">◀</button><span></span><button data-dir="right">▶</button>

</div>
<div id="joy" aria-hidden="true"><div id="joyKnob"></div></div>

function drawMerchant(now) {

const wilds = []; let wildSpawnT = 0;
function spawnWild() {
  for (let i = wilds.length - 1; i >= 0; i--) if (Math.hypot(wilds[i].x - player.x, wilds[i].y - player.y) > 24 * T) wilds.splice(i, 1);
  if (wilds.length >= 4 || !me) return;
  const ks = Object.keys(ANIMALS), k = ks[Math.floor(Math.random() * ks.length)], A = ANIMALS[k];
  for (let tries = 0; tries < 40; tries++) {
    const a = Math.random() * Math.PI * 2, d = (6 + Math.random() * 8) * T, x = player.x + Math.cos(a) * d, y = player.y + Math.sin(a) * d, tx = Math.floor(x / T), ty = Math.floor(y / T), t = tileAt(tx, ty);
    if (ty > 39 || ty < 2 || isSolid(tx, ty)) continue;
    if (A.water) { if (!(t === G || t === F || t === S || t === D) || ![[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => tileAt(tx + dx, ty + dy) === W)) continue; }
    else if (t !== G && t !== F) continue;
    wilds.push({ k, x, y, vx: 0, vy: 0, nextT: 0, flee: false, fleeT: 0, petted: false, heartT: -1e9, face: -1, tameUntil: 0 });
    return;
  }
}
function updateWild(dt, now) {
  if (now - wildSpawnT > 2500) { wildSpawnT = now; spawnWild(); }
  for (let i = wilds.length - 1; i >= 0; i--) {
    const a = wilds[i];
    if (a.flee) { a.x += a.vx * dt; a.y += a.vy * dt; if (now - a.fleeT > 1500) wilds.splice(i, 1); continue; }
    const d = Math.hypot(a.x - player.x, a.y - player.y), tame = now < a.tameUntil;
    if (!tame && player.running && player.moving && d < 2.5 * T) { a.flee = true; a.fleeT = now; const an = Math.atan2(a.y - player.y, a.x - player.x); a.vx = Math.cos(an) * 150; a.vy = Math.sin(an) * 150; a.face = a.vx < 0 ? -1 : 1; continue; }
    if (tame && d > 1.6 * T) { const an = Math.atan2(player.y - a.y, player.x - a.x); a.vx = Math.cos(an) * 70; a.vy = Math.sin(an) * 70; a.face = a.vx < 0 ? -1 : 1; }
    else if (tame) { a.vx = 0; a.vy = 0; }
    else if (now > a.nextT) { if (Math.random() < .5) { a.vx = 0; a.vy = 0; } else { const an = Math.random() * 7; a.vx = Math.cos(an) * 22; a.vy = Math.sin(an) * 22; a.face = a.vx < 0 ? -1 : 1; } a.nextT = now + 1500 + Math.random() * 2500; }
    const nx = a.x + a.vx * dt, ny = a.y + a.vy * dt, tx = Math.floor(nx / T), ty = Math.floor(ny / T);
    if (!isSolid(tx, ty) && !isSwimTile(tx, ty) && ty <= 39 && ty >= 1) { a.x = nx; a.y = ny; } else { a.vx = -a.vx; a.vy = -a.vy; a.nextT = now + 800; }
  }
}
function drawWild(a, now) {
  const A = ANIMALS[a.k], mv = Math.hypot(a.vx, a.vy) > 1, hop = mv ? Math.abs(Math.sin(now / 120)) * 3 : 0;

}

      c.font = '13px Jua, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      names.forEach((nm, i) => { c.fillStyle = COLS[i % COLS.length]; roundRectC(c, colX(i) - 30, 6, 60, 24, 8); c.fill(); c.fillStyle = '#2f4a3a'; c.fillText(nm, colX(i), 18); });

      names = parse();

            const a = p.pts[j - 1], b = p.pts[j], L = Math.hypot(b[0] - a[0], b[1] - a[1]);

      };
      raf = requestAnimationFrame(step);
    };
    drawBase(false);
    area.append(el('label', { for: 'cf-res', text: '결과 항목 (한 줄에 하나, 위에서부터 사다리 아래 칸에 놓여요)' }), resTa,
      el('div', { class: 'inline', style: 'margin-top:10px' }, btn), el('div', { class: 'ladder-scroll' }, cv), out);
  }
  function renderArea() { area.replaceChildren(); if (sub === 'roulette') roulette(); else ladder(); }
  body.append(el('p', { class: 'lead', text: '접속 중인 사람 이름이 미리 채워져 있어요. 한 줄에 한 명씩, 12명까지 고칠 수 있어요. 결과는 마을 전체 알림으로 알려요.' }),
    el('label', { for: 'cf-names', text: '참가자' }), namesTa, el('div', { style: 'margin-top:10px' }, subs), area);
  renderSubs(); renderArea();
  return () => cancelAnimationFrame(raf);
}

/* ---------- 오락실: 혼자 하는 게임 ---------- */
const spaceKey = (e, fn) => { const tg = e.target && e.target.tagName; if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return; if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) fn(); } };

/* 멀리뛰기 */
function longJumpTab(body) {
  const W = 640, H = 230, PIT = 190;
  const cv = el('canvas', { width: W, height: H, class: 'solo-canvas', 'aria-label': '멀리뛰기' });
  const c = cv.getContext('2d');
  const info = el('p', { class: 'lead', style: 'text-align:center;margin:8px 0' });
  const btn = el('button', { class: 'bell tapbtn', text: '뛰기!' });
  let phase = 'aim', t0 = performance.now(), raf = 0, pos = 0, anim = null, last = 0;
  const best = () => Number(me.log.bestJump) || 0;
  const setInfo = pre => { info.textContent = (pre ? pre + ' ' : '') + '내 기록 ' + best().toFixed(2) + 'm. 좌우로 움직이는 게이지가 가운데 초록 칸에 왔을 때 눌러요. 신기록이면 300벨!'; };

    c.fillStyle = '#dff4ff'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#ffffff'; [[90, 70], [380, 55], [560, 85]].forEach(([x, y]) => { c.beginPath(); c.ellipse(x, y, 34, 12, 0, 0, 7); c.fill(); });
    c.fillStyle = '#b6e39a'; c.fillRect(0, 172, W, H - 172);
    c.fillStyle = '#d9a46b'; c.fillRect(0, 166, PIT, 8);
    c.fillStyle = '#f6e6b5'; c.fillRect(PIT, 166, W - PIT, 14);
    c.fillStyle = '#ffffff'; c.fillRect(PIT - 4, 166, 4, 8);
    c.fillStyle = '#8a6a42'; c.font = '11px Jua, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    for (let m = 1; m <= 10; m++) { const x = PIT + m * 42; if (x > W - 8) break; c.fillRect(x, 180, 1, 6); c.fillText(m + 'm', x, 198); }
    if (best() > 0) { const bx = PIT + best() * 42; c.fillStyle = '#e8473f'; c.fillRect(bx - 1, 142, 2, 28); c.fillText('내 기록', bx, 138); }
    let px = 60, py = 168, frame = 0;
    if (anim) {
      const k = Math.min(1, (now - anim.t) / anim.dur);
      if (k < .35) { px = 60 + (PIT - 60) * (k / .35); frame = ((now / 80) | 0) % 2 + 1; }
      else { const j = (k - .35) / .65; px = PIT + anim.d * 42 * j; py = 168 - Math.sin(Math.PI * j) * (36 + anim.d * 7); }

    }
    c.fillStyle = 'rgba(47,74,58,.2)'; c.beginPath(); c.ellipse(px, 170, 11, 4, 0, 0, 7); c.fill();
    c.imageSmoothingEnabled = false; c.drawImage(getSprite(validPx(me.px), 3, frame), px - 16, py - 40, 32, 40);
    if (phase === 'done' && anim) { c.fillStyle = '#2f4a3a'; c.font = '22px Jua, sans-serif'; c.fillText(anim.d.toFixed(2) + 'm', PIT + anim.d * 42, 120); }
    const gx = 120, gy = 22, gw = 400, gh = 24;
    c.fillStyle = '#f6c2bd'; c.fillRect(gx, gy, gw, gh);
    c.fillStyle = '#ffe08a'; c.fillRect(gx + gw * .3, gy, gw * .4, gh);
    c.fillStyle = '#7fd68a'; c.fillRect(gx + gw * .44, gy, gw * .12, gh);
    c.strokeStyle = '#2f4a3a'; c.lineWidth = 2; c.strokeRect(gx, gy, gw, gh);

    if (phase !== 'aim') return;
    const off = Math.abs(pos - .5), power = 1 - off * 2, green = off <= .06;
    const d = Math.round((1.4 + 6.6 * Math.pow(Math.max(0, power), 1.8) + (green ? .6 : 0) + Math.random() * .15) * 100) / 100;

/* 장애물달리기 */
function runnerTab(body) {
  const W = 640, H = 240, G = 200, PX = 96;
  const cv = el('canvas', { width: W, height: H, class: 'solo-canvas', 'aria-label': '장애물달리기' });
  const c = cv.getContext('2d');
  const info = el('p', { class: 'lead', style: 'text-align:center;margin:8px 0' });
  const btn = el('button', { class: 'bell tapbtn', text: '달리기 시작' });
  const OBS = [{ w: 24, h: 20, icon: '🍌' }, { w: 22, h: 28, icon: '🧱' }, { w: 28, h: 40, icon: '🌵' }];
  let st = null, raf = 0;
  const best = () => Number(me.log.bestRun) || 0;
  const setInfo = t => { info.textContent = t || ('Space나 화면을 누르면 점프, 공중에서 한 번 더 누르면 2단 점프예요. 50m마다 10벨, 신기록이면 200벨을 더 받아요. 내 기록 ' + best() + 'm'); };
  function start() { const now = performance.now(); st = { y: G, vy: 0, jumps: 0, speed: 260, dist: 0, obs: [], gap: 420, t0: now, last: now, over: false }; btn.textContent = '점프'; setInfo(); }
  function jump() {
    if (!st || st.over) { start(); return; }
    if (st.y >= G && st.jumps === 0) { st.vy = -640; st.jumps = 1; }
    else if (st.jumps < 2) { st.vy = -560; st.jumps = 2; }
  }
  function end() {
    st.over = true;
    const m = Math.floor(st.dist), reward = Math.min(500, Math.floor(m / 50) * 10), rec = m > best();
    if (rec) me.log.bestRun = m;
    const total = reward + (rec && m > 0 ? 200 : 0);
    if (total) me.bells += total;
    markDirty();
    btn.textContent = '다시 달리기';
    const msg = m + 'm를 달렸어요. ' + (total ? fmtBell(total) + '을 받았어요' + (rec ? ' (신기록 보너스 포함)' : '') : '50m를 넘기면 벨을 받아요');
    setInfo(msg + '.'); toast(msg, total ? 'good' : '');
    if (m >= 500) announce(me.name + '님이 장애물달리기에서 ' + m + 'm를 달렸어요!');
  }
  function draw(now) {
    c.fillStyle = '#e9f6ff'; c.fillRect(0, 0, W, H);
    const off = st ? st.dist * 40 : 0;
    c.fillStyle = '#ffffff';
    for (let i = 0; i < 4; i++) { const x = ((i * 220 - off * .2) % (W + 120) + W + 120) % (W + 120) - 60; c.beginPath(); c.ellipse(x, 40 + (i % 2) * 22, 36, 12, 0, 0, 7); c.fill(); }
    c.fillStyle = '#d7e6c8';
    for (let i = 0; i < 6; i++) { const x = ((i * 140 - off * .5) % (W + 140) + W + 140) % (W + 140) - 70; c.fillRect(x, G - 70, 46, 70); c.fillStyle = '#c4d8b2'; c.fillRect(x + 8, G - 60, 10, 10); c.fillRect(x + 28, G - 60, 10, 10); c.fillStyle = '#d7e6c8'; }
    c.fillStyle = '#e9c99d'; c.fillRect(0, G, W, H - G);
    c.fillStyle = '#dcb886'; for (let x = -((off) % 40); x < W; x += 40) c.fillRect(x, G + 10, 20, 3);
    if (st) {
      c.font = '30px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'bottom'; c.fillStyle = '#000000';
      for (const o of st.obs) { c.font = (o.h + 8) + 'px sans-serif'; c.fillText(o.icon, o.x + o.w / 2, G + 4); }
    }
    const y = st ? st.y : G, onG = y >= G;
    const frame = st && !st.over && onG ? ((now / 90) | 0) % 2 + 1 : 0;
    c.fillStyle = 'rgba(47,74,58,.2)'; c.beginPath(); c.ellipse(PX, G + 2, 11, 4, 0, 0, 7); c.fill();
    c.imageSmoothingEnabled = false;
    c.save(); c.translate(PX, y - 20);
    if (st && st.over) c.rotate(-1.2);
    c.drawImage(getSprite(validPx(me.px), 3, frame), -16, -20, 32, 40); c.restore();
    c.fillStyle = '#2f4a3a'; c.font = '18px Jua, sans-serif'; c.textAlign = 'right'; c.textBaseline = 'top';
    c.fillText((st ? Math.floor(st.dist) : 0) + 'm', W - 14, 12);
    c.font = '13px Jua, sans-serif'; c.fillText('내 기록 ' + best() + 'm', W - 14, 34);
    if (!st) { c.textAlign = 'center'; c.font = '20px Jua, sans-serif'; c.fillText('달리기 시작을 눌러요', W / 2, 90); }
    else if (st.over) { c.textAlign = 'center'; c.font = '28px Jua, sans-serif'; c.fillStyle = '#e8473f'; c.fillText('꽈당!', W / 2, 80); }
  }
  function loop(now) {
    raf = requestAnimationFrame(loop);
    if (st && !st.over) {
      const dt = Math.min(.033, (now - st.last) / 1000); st.last = now;
      st.speed = Math.min(720, 260 + (now - st.t0) / 1000 * 12);
      st.dist += st.speed * dt / 40;

      if (st.y >= G) { st.y = G; st.vy = 0; st.jumps = 0; }
      st.gap -= st.speed * dt;
      if (st.gap <= 0) {
        const o = OBS[Math.floor(Math.random() * (st.dist > 60 ? 3 : 2))];

        st.gap = (300 + Math.random() * 320) * Math.pow(st.speed / 260, .8);
      }
      for (const o of st.obs) o.x -= st.speed * dt;
      st.obs = st.obs.filter(o => o.x > -50);

      for (const o of st.obs) if (o.x + 4 < x1 && o.x + o.w - 4 > x0 && G - o.h + 5 < y1 && G > y0) { end(); break; }

    draw(now);
  }

  cv.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
  const kd = e => spaceKey(e, jump);
  window.addEventListener('keydown', kd);
  setInfo(); raf = requestAnimationFrame(loop);
  body.append(cv, info, el('div', { class: 'inline', style: 'justify-content:center' }, btn));
  return () => { cancelAnimationFrame(raf); window.removeEventListener('keydown', kd); };
}

/* 행운의 게임: 게임 속 벨만 사용 */

/* 2048 */
const T2048 = { 2: ['#f3ead7', '#5a4a3a'], 4: ['#efe0c0', '#5a4a3a'], 8: ['#f6b27a', '#fff'], 16: ['#f59a63', '#fff'], 32: ['#f47d5e', '#fff'], 64: ['#ef5f3b', '#fff'], 128: ['#edcf72', '#fff'], 256: ['#edcc61', '#fff'], 512: ['#7cc9a7', '#fff'], 1024: ['#5fb393', '#fff'], 2048: ['#3d8bd9', '#fff'] };

/* 짝 맞추기 */

  const holes = Array.from({ length: 9 }, (_, i) => el('button', { class: 'mole-hole', 'aria-label': (i + 1) + '번 구멍', onclick: () => hit(i) }));
  const stats = el('div', { class: 'game-stats' }), info = el('p', { class: 'lead', style: 'text-align:center;margin:0' });

function typingTab(body) {
  const W = 640, H = 300;
  const POOL = [...CM_EASY, ...CM_HARD.filter(w => !/\s/.test(w) && [...w].length <= 6)];
  const cv = el('canvas', { width: W, height: H, class: 'solo-canvas', 'aria-label': '타자왕 화면', style: 'background:#f7fbff' });
  const c = cv.getContext('2d');
  const inp = el('input', { maxlength: 20, placeholder: '떨어지는 단어를 치고 Space나 Enter', 'aria-label': '단어 입력', autocomplete: 'off', style: 'max-width:640px;display:block;margin:8px auto 0' });
  const info = el('p', { class: 'lead', style: 'text-align:center;margin:8px 0' });
  const btn = el('button', { class: 'bell tapbtn', text: '시작' });
  let st = null, raf = 0, composing = false, flash = [];
  const best = () => Number(me.log.bestType) || 0;
  function start() { const now = performance.now(); st = { words: [], lives: 3, score: 0, t0: now, last: now, next: now + 300, over: false }; inp.value = ''; inp.disabled = false; inp.focus(); btn.disabled = true; info.textContent = '단어가 바닥에 닿기 전에 쳐서 없애요. 3개를 놓치면 끝나요.'; }

    if (!st || st.over || composing) return;

    if (i >= 0) { const o = st.words.splice(i, 1)[0]; st.score += [...v].length; flash.push({ x: o.x, y: o.y, t: performance.now(), txt: '+' + [...v].length }); inp.value = ''; }
    else if (force) inp.value = '';

  inp.addEventListener('compositionstart', () => { composing = true; });
  inp.addEventListener('compositionend', () => { composing = false; setTimeout(() => tryMatch(false), 0); });
  inp.addEventListener('input', () => tryMatch(false));

    info.textContent = st.score + '글자를 쳤어요!' + (rec ? ' 신기록!' : '');
    soloReward(Math.min(300, Math.floor(st.score / 5) * 5) + (rec && st.score > 0 ? 150 : 0), '타자왕 ' + st.score + '글자!');
  }
  function loop(now) {
    raf = requestAnimationFrame(loop);
    c.fillStyle = '#f7fbff'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#e8736f'; c.fillRect(0, H - 6, W, 6);
    if (st && !st.over) {
      const dt = Math.min(.05, (now - st.last) / 1000); st.last = now;
      const el2 = (now - st.t0) / 1000, sp = 26 + el2 * 1.1;
      if (now >= st.next) { c.font = '18px Jua, sans-serif'; const w = POOL[Math.floor(Math.random() * POOL.length)], tw = c.measureText(w).width; st.words.push({ w, x: 20 + Math.random() * (W - 40 - tw), y: 0, tw }); st.next = now + Math.max(900, 2300 - el2 * 25); }
      for (const o of st.words) o.y += sp * dt;
      for (let i = st.words.length - 1; i >= 0; i--) if (st.words[i].y > H - 8) { st.words.splice(i, 1); st.lives--; flash.push({ x: W / 2, y: H - 30, t: now, txt: '놓쳤어요!' }); }
      if (st.lives <= 0) end();
    }
    if (st) {
      c.font = '18px Jua, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
      const v = inp.value.trim();
      for (const o of st.words) { const hit = v && o.w.startsWith(v); c.fillStyle = hit ? '#d8f3e6' : '#ffffff'; roundRectC(c, o.x - 6, o.y - 18, o.tw + 12, 24, 8); c.fill(); c.strokeStyle = hit ? '#2e8a68' : '#c9d6e2'; c.lineWidth = 1.5; c.stroke(); c.fillStyle = '#2f4a3a'; c.fillText(o.w, o.x, o.y); }
      c.textAlign = 'right'; c.fillStyle = '#2f4a3a'; c.fillText('점수 ' + st.score + '   목숨 ' + '♥'.repeat(Math.max(0, st.lives)), W - 12, 24);
      c.textAlign = 'center';
      flash = flash.filter(f => now - f.t < 700);
      for (const f of flash) { c.globalAlpha = 1 - (now - f.t) / 700; c.fillStyle = f.txt.startsWith('+') ? '#2e8a68' : '#e8473f'; c.fillText(f.txt, f.x + 20, f.y - 20 - (now - f.t) / 30); c.globalAlpha = 1; }
      if (st.over) { c.font = '28px Jua, sans-serif'; c.fillStyle = '#2f4a3a'; c.fillText('끝! ' + st.score + '글자', W / 2, H / 2); }
    } else { c.font = '20px Jua, sans-serif'; c.textAlign = 'center'; c.fillStyle = '#2f4a3a'; c.fillText('시작을 누르면 단어가 떨어져요', W / 2, H / 2); c.font = '14px Jua, sans-serif'; c.fillText('내 기록 ' + best() + '글자', W / 2, H / 2 + 28); }
  }
  btn.onclick = start;
  inp.disabled = true;
  info.textContent = '떨어지는 단어를 빠르게 쳐서 없애요. 한 글자에 1점, 5점마다 5벨이에요.';
  raf = requestAnimationFrame(loop);
  body.append(cv, inp, info, el('div', { class: 'inline', style: 'justify-content:center' }, btn), soloNote());
  return () => cancelAnimationFrame(raf);
}

const b64u = u8 => { let s2 = ''; for (let i = 0; i < u8.length; i += 0x8000) s2 += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s2).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };

  const json = JSON.stringify({ v: 1, me, museum, board: mode === 'online' ? [] : boardPosts, trees: treeState });
  const bytes = new TextEncoder().encode(json);
  try { if (window.CompressionStream) { const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip')); return 'KJ1.' + b64u(new Uint8Array(await new Response(cs).arrayBuffer())); } } catch (e) {}
  return 'KJ0.' + b64u(bytes);

async function decodeSave(code) {
  const m = /^KJ([01])\.([A-Za-z0-9_-]+)$/.exec(String(code).replace(/\s+/g, ''));

}

function blocked(x, y) {

}
function updatePlayer(dt) {

    if (keys.has('arrowleft') || keys.has('a') || padDirs.has('left')) dx -= 1;
    if (keys.has('arrowright') || keys.has('d') || padDirs.has('right')) dx += 1;
    if (keys.has('arrowup') || keys.has('w') || padDirs.has('up')) dy -= 1;
    if (keys.has('arrowdown') || keys.has('s') || padDirs.has('down')) dy += 1;

async function start() {
  setLoading('마을에 연결하는 중이에요…');
  const cl = window.claude;
  const hasCl = !!cl && typeof cl.use === 'function';
  const roomP = hasCl ? cl.use('room').catch(() => null) : Promise.resolve(null);
  const attempt = (async () => {
    if (!hasCl) return null;
    const [d, u] = await Promise.all([cl.use('db'), cl.use('user')]);
    if (!d || !u) return null;
    const id = await u.id();
    if (!id) return null;
    const owner = await u.isOwner();
    const snap = await d.doc('residents/' + id).get();
    return { d, id, owner, snap };
  })().catch(() => null);
  const res = await Promise.race([attempt, new Promise(r => setTimeout(() => r(null), 12000))]);
  if (res) {
    mode = 'online'; db = res.d; uid = res.id; isOwner = !!res.owner;
    if (res.snap.exists) { me = normalizeMe(clone(res.snap.data())); villagers.set(uid, clone(me)); rebuildHouses(); }
    subscribeAll();

    mode = 'solo'; uid = 'me';

    toast('혼자 모드로 시작해요. 기록은 이 브라우저에만 저장돼요. 친구와 함께하려면 새로고침 후 Google로 로그인해요', 'warn');
  }
  updateHUD();
  if (me) { hideLoading(); spawnAtHome(); toast(me.name + '님, 어서 와요!', 'good'); }

}

    }

    }
